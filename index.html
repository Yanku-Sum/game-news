<script id="analysis-data" type="application/json">[{"date":"2026-07-28","game":"그림 던 (Grim Dawn) — 아스터칸의 송곳니","hook":"2016년 출시된 10년 차 핵앤슬래시 ARPG가 7월 23일 마지막 확장팩 '아스터칸의 송곳니'를 내놓으며 동시접속자 2만 7,820명으로 출시 초기를 제외한 10년 중 최고 기록을 경신했습니다. 신규 마스터리 '버서커'와 32% 넓어진 월드로 '사실상 그림 던 2'라는 평가를 받는 동시에, 개발사 크레이트 엔터테인먼트가 실제 후속작 준비를 공식화하면서 ARPG 커뮤니티의 최대 화두가 됐습니다.","coreLoop":"캠페인·던전 진입 → 몬스터 무리를 처치하며 무작위 옵션이 붙은 장비와 재료 획득 → 장비 교체·강화와 스킬 포인트·데보션 포인트 재분배로 빌드 정비 → 더 높은 난이도(엘리트·얼티메이트·어센던트)와 상위 던전 재도전, 이 순환이 반복됩니다. 두 개의 마스터리를 겹쳐 만드는 듀얼 클래스와, 클래스와 무관하게 붙는 별도 축인 '데보션'(성좌) 시스템이 있어 파밍의 목적이 단순 수치 상승이 아니라 '내가 머릿속에 그린 빌드를 완성할 마지막 한 조각을 찾는 것'으로 설정되는 것이 루프의 핵심입니다.","growthCurve":"성장은 3중 축입니다. (1) 레벨 2에서 첫 마스터리, 레벨 10에서 두 번째 마스터리를 골라 확정되는 클래스 정체성 (2) 필드 곳곳의 데보션 사당을 복원해 얻는 포인트로 클래스와 독립적으로 쌓는 성좌 보너스 (3) 무작위 옵션·세트 아이템 파밍을 통한 빌드 완성도. 초반에는 마스터리 하나만으로 단순하게 진행되다가 10레벨을 기점으로 조합 경우의 수가 폭발하고, 이번 확장팩의 10번째 마스터리 '버서커' 추가로 듀얼 조합이 45종까지 늘었습니다. 엔드게임은 같은 캠페인을 노멀→엘리트→얼티메이트로 반복하는 전통적 구조인데, 이번에 추가된 '어센던트' 모드가 캠페인 자체를 고난도로 재구성하는 축을 하나 더 얹었습니다.","funMechanics":"재미의 핵심은 '빌드를 설계하는 즐거움'입니다. 45종의 듀얼 클래스 조합 × 데보션 성좌 × 아이템 세트가 곱해지며 정답이 하나가 아닌 구조를 만들고, 스스로 짠 조합이 실제로 화면을 가득 채운 몬스터를 녹여버리는 순간의 검증 쾌감이 지루할 수 있는 반복 파밍을 견디게 합니다. 여기에 무작위 드랍 특유의 도박적 기대감과, 어두운 스팀펑크 종말 세계관이 주는 묵직한 분위기가 결합돼 '한 판만 더'의 동기를 지속적으로 만들어냅니다.","benchmarks":"① 10년간 유료 확장팩과 무료 패치만으로 수명을 늘려온 게임이 '마지막 확장팩'에서 역대 최대 동접을 찍은 것은, 시즌패스·배틀패스 없이도 완결성 있는 콘텐츠 추가만으로 라이브 서비스가 성립할 수 있음을 보여주는 사례입니다. ② 클래스(마스터리)와 별개로 데보션이라는 독립 성장 축을 둬, 같은 클래스라도 전혀 다른 캐릭터가 되게 만든 빌드 다양성 설계는 반복 플레이 동기 설계의 교과서입니다. ③ 마지막 확장팩을 '월드 32% 확장 + 신규 마스터리'라는 역대 최대 규모로 잡고, 그 화제성 위에 후속작(그림 던 2) 준비 소식을 얹어 IP 종결과 차기작 기대감을 한 번에 처리한 전환 전략. ④ 반면 출시 직후 일부 환경에서 실행 오류가 보고된 점은, 10년 누적된 레거시 코드 위에 대형 확장을 얹을 때의 QA 리스크를 보여주는 반면교사입니다.","businessModel":"완전 프리미엄 모델로, 본편 단품 판매에 유료 확장팩을 얹는 전통적 패키지 구조입니다. '아스터칸의 송곳니'는 정가 2만 원(출시 기념 10% 할인가 1만 8천 원)이며, 기존 확장팩 '재의 맘무스'와 '잊혀진 신들'을 모두 보유해야 플레이할 수 있는 선행 DLC 조건이 걸려 있어 신규 유저 유입 시 구작 DLC 판매까지 함께 견인하는 구조입니다. 마이크로트랜잭션·구독·배틀패스는 전혀 없고, 수익은 스팀·GOG의 본편 및 DLC 판매와 주기적인 할인 이벤트에서 발생합니다.","onboarding":"튜토리얼은 최소한으로, 첫 마을에 도착하기까지의 짧은 구간에서 기본 조작과 전투만 익히게 합니다. 문제는 그 직후입니다. 레벨 2와 10에서 되돌리기 까다로운 마스터리 선택을 요구하고, 데보션 성좌판과 아이템 옵션 용어량이 상당한데도 게임 내에 빌드 설계를 안내하는 장치가 거의 없어, 신규 유저 상당수가 외부 빌드 가이드나 그림툴즈 같은 커뮤니티 도구에 의존하게 됩니다. 진입 자체는 쉽지만 '제대로 하려면' 게임 밖 학습이 필수인 구조적 약점이 10년째 남아 있습니다.","targetUser":"디아블로2 계열의 '빌드를 직접 짜고 파밍으로 완성하는' 고전 핵앤슬래시 경험을 원하는 30~40대 코어 ARPG 유저가 1차 타겟입니다. 시즌·리그 단위로 캐릭터를 초기화하는 패스 오브 엑자일이나 라이브 운영 압박이 큰 디아블로4와 달리, 시즌 리셋도 과금 압박도 없이 자기 페이스대로 캐릭터를 오래 키울 수 있다는 점을 명확한 차별화 포인트로 삼습니다.","community":"공식 크레이트 엔터테인먼트 포럼이 빌드 공유와 핫픽스 논의의 중심지로 기능하고, 그림툴즈(GrimTools) 같은 유저 제작 빌드 계산기·아이템 데이터베이스가 사실상 게임의 필수 인프라로 자리 잡았습니다. 개발사가 포럼에 핫픽스와 향후 변경 사항을 직접 공지하며 소통하는 방식이 10년간 팬덤을 유지한 동력이며, 최대 4인 협동 멀티플레이와 활발한 유저 모드 생태계가 공식 콘텐츠가 멈춘 기간에도 수명을 유저 손으로 연장하는 장치로 작동해 왔습니다.","links":[{"title":"'그림 던' 신규 확장팩 '팡스 오브 아스테르칸', 역대 최대 동시접속자 기록","url":"https://www.gamemeca.com/view.php?gid=1778323","source":"게임메카"},{"title":"Grim Dawn - Fangs of Asterkarn (Steam)","url":"https://store.steampowered.com/app/2699230/Grim_Dawn__Fangs_of_Asterkarn/","source":"Steam"},{"title":"OARPG Grim Dawn's biggest – and final – expansion, Fangs of Asterkarn, is live today as Crate eyes new projects","url":"https://massivelyop.com/2026/07/23/oarpg-grim-dawns-biggest-and-final-expansion-fangs-of-asterkarn-is-live-today-as-crate-eyes-new-projects/","source":"Massively Overpowered"},{"title":"Crate Entertainment Opens Up on Grim Dawn: Fangs of Asterkarn's Massive Scope, Long Development, and What Comes Next","url":"https://wccftech.com/grim-dawn-fangs-of-asterkarn-scope-development-next/","source":"Wccftech"},{"title":"About – Fangs of Asterkarn (공식 가이드)","url":"https://www.grimdawn.com/guide/about/fangs-of-asterkarn/","source":"Grim Dawn 공식"}]},{"date":"2026-07-27","game":"헤일로: 캠페인 이볼브드 (Halo: Campaign Evolved)","hook":"2001년 오리지널 '헤일로: 컴뱃 이볼브드'를 언리얼엔진5로 새로 만든 이 리메이크가 프리미엄 조기 플레이와 함께 스팀 판매 1위에 오르며 시리즈 최초로 플레이스테이션에도 상륙했지만, 컷신 30프레임 고정과 잦은 프레임 저하, 강제 계정 연동 같은 문제로 스팀 유저 평가가 '복합적'에 머물며 출시 직후 커뮤니티 논쟁의 중심에 섰습니다.","coreLoop":"미션 시작 → 코버넌트·플러드 등 적을 상대로 총기·근접 무기·수류탄을 조합한 총격전 진행 → 필드에 떨어진 무기로 실시간 교체(투맨웨폰 시스템)하며 화력 유지 → 워트호그·고스트 등 차량으로 대규모 전장을 돌파 → 마린 동료 분대를 지휘해 화력 지원을 받으며 전진 → 체크포인트 도달 후 다음 구간·미션으로 이동, 이 순환이 캠페인 종료까지 반복됩니다. 여기에 신규 프리퀄 미션 3개(마스터 치프·존슨 상사 시점)가 추가돼 기존 스토리의 공백을 메우는 별도 루프가 병행됩니다.","growthCurve":"전통적 레벨링은 없고, (1) 미션이 진행될수록 해금되는 신규 무기·차량 종류 (2) 난이도 선택(이지~레전더리)에 따른 적 AI 공격성·물량 변화 (3) 최대 4인 협동 인원수에 따라 조정되는 적 스폰량이라는 3중 축으로 페이싱을 조절합니다. 초반은 인간 진영 대 코버넌트 전투로 시작해, 중반 이후 플러드가 등장하며 근접전 위주로 전투 문법이 급변하고, 후반 대규모 물량전에서 난이도가 정점을 찍는 원작의 곡선을 그대로 유지합니다.","funMechanics":"재미의 핵심은 총기·수류탄·근접공격의 삼각 밸런스와, 넓은 지형에서 차량전과 보병전을 자유롭게 오가는 전술적 선택지입니다. 리메이크는 달리기 기능과 현대적 조준감을 더해 원작 특유의 '반복해도 질리지 않는' 전투 루프를 살리면서 진입장벽만 낮췄고, 향상된 그래픽·조명으로 25년 전 명장면을 다시 체험하는 향수 자극이 몰입의 큰 축입니다.","benchmarks":"① 그래픽·조작만 현대화하고 오리지널 레벨 디자인·전투 밸런스는 그대로 보존하는 '충실한 리메이크' 전략은 원작 팬의 향수를 IP 확장의 동력으로 삼는 대표 사례입니다. ② 신규 프리퀄 미션으로 기존 스토리의 빈틈을 채워 '리메이크+α'의 구매 명분을 만든 콘텐츠 전략. ③ 프리미엄 구매자 대상 5일 조기 플레이로 초반 화제성과 매출을 동시에 확보해 스팀 판매 1위를 달성했지만, 동시에 '검증 안 된 빌드를 먼저 판다'는 비판의 빌미가 되기도 했습니다. ④ 컷신 프레임 고정, 상시 계정 연동 등 최적화·정책 이슈를 사전 검증 없이 출시해 평가를 '복합적'에 머물게 한 것은 반면교사로 참고할 지점입니다.","businessModel":"완전 프리미엄 단일 구매 모델로, 스탠다드 에디션 49.99달러, 프리미엄·컬렉터스 에디션은 59.99~199.99달러로 무기·아머 스킨 팩 같은 코스메틱을 얹은 구조입니다. 마이크로트랜잭션이나 시즌패스 없이 캠페인 단품 판매로 수익을 내며, Xbox 게임패스 구독 서비스에도 출시 당일 포함돼 구독 매출까지 동시에 노리는 이중 유통 전략을 취합니다.","onboarding":"원작의 튜토리얼 없는 '필드에 던져놓고 배우게 하는' 구조를 유지하되, 현대적 조준 보조·달리기 기능으로 조작 자체의 진입장벽은 낮췄습니다. 다만 세이브 포인트 기반 체크포인트와 탄약 관리 등 2000년대 초반 FPS 특유의 설계가 그대로 남아있어, 최신 슈팅에 익숙한 신규 유저에게는 낯선 학습 곡선이 존재합니다.","targetUser":"2001년 오리지널을 플레이한 3040대 올드팬을 1차 타겟으로 콘솔 향수 마케팅을 펼치면서도, 시리즈 최초로 플레이스테이션5에 출시해 한 번도 헤일로를 접하지 못한 플레이스테이션 유저층까지 신규로 확보하려는 크로스 플랫폼 전략을 취합니다.","community":"출시 직후 스팀 커뮤니티에는 프레임 저하·컷신 이슈에 대한 불만과 '마스터 치프 컬렉션이나 원작 PC 포트를 사라'는 반대 여론이 동시에 올라오며 활발한 논쟁이 벌어지고 있습니다. 반면 최대 4인 온라인 협동과 콘솔 2인 스플릿 스크린을 지원해, 오리지널 시절 친구와 함께한 스플릿 스크린 협동의 향수를 다시 자극하는 것이 커뮤니티 결속의 핵심 장치로 작동하고 있습니다.","links":[{"title":"[오늘의 스팀] UE5로 다시 만든 헤일로 1편, 평가 '복합적'","url":"https://www.gamemeca.com/view.php?gid=1778263","source":"게임메카"},{"title":"새로운 3개 미션 추가! 리메이크로 돌아온 '헤일로: 캠페인 이볼브드'","url":"https://www.inven.co.kr/webzine/news/?news=317227","source":"인벤"},{"title":"Halo: Campaign Evolved review","url":"https://www.pcgamer.com/games/halo/halo-campaign-evolved-review/","source":"PC Gamer"},{"title":"Halo: Campaign Evolved — The Brand New Features in This Remake of A Classic","url":"https://news.xbox.com/en-us/2026/07/23/halo-campaign-evolved-early-access-launch-xbox/","source":"Xbox Wire"}]},{"date":"2026-07-22","game":"솔: 인챈트 (SOL: enchant)","hook":"지난 6월 18일 출시된 넷마블의 신작 MMORPG가 한 달이 넘도록 오딘·리니지M과 어깨를 나란히 하며 국내 모바일 매출 상위권을 지키고 있는데, 그 동력이 '유저가 직접 서버의 신이 되어 규칙을 바꾼다'는 파격적인 '신권' 시스템과 부캐 동시 육성을 지원하는 '스쿼드 모드'로 지목되면서 여전히 업계와 커뮤니티의 화두가 되고 있는 게임입니다.","coreLoop":"필드 사냥·퀘스트로 핵심 재화 '나인' 획득 → 시즌 동안 나인을 가장 많이 소모한 유저가 서버신·주신·절대신 중 하나의 '신권'을 획득 → 신이 된 유저는 필드의 안전·전쟁 지역 판정을 바꾸거나 몬스터를 대량 소환하는 등 서버 규칙에 직접 개입 → 일반 유저도 '나인트리' 오브젝트와 상호작용하면 '메테오' 같은 신권 일부를 체험하며 나인 회수 → 획득한 재화로 장비·스킬 강화 → 스쿼드 모드로 부캐를 동시에 자동 사냥시켜 파밍 가속 → 다시 나인을 모아 신권 경쟁에 재도전하는 순환이 시즌마다 반복됩니다.","growthCurve":"성장 축은 (1) 본캐 레벨링에 따른 장비·스킬 강화 (2) 캐릭터 40레벨 달성 시 해금되는 스쿼드 모드로 부캐를 동시 육성하는 병렬 성장 (3) 시즌마다 초기화·재점화되는 신권 경쟁이라는 3중 구조입니다. 초반에는 본캐 레벨업에 집중하다가 40레벨을 기점으로 부캐 동반 육성이 열리면서 성장 속도가 급격히 빨라지고, 신권 시스템은 시즌 단위로 순위가 리셋돼 상위 유저 간 경쟁이 주기적으로 재점화되는 곡선을 만듭니다.","funMechanics":"가장 큰 재미는 '내가 서버의 신이 되어 다른 유저들이 사는 세계의 규칙 자체를 바꾼다'는 권력 판타지입니다. 절대신·주신·서버신이라는 계층 구조와 '나인트리'를 통해 신이 아닌 일반 유저도 신권의 일부(메테오 등)를 체험할 수 있게 열어둬, 최상위 소수만이 아니라 폭넓은 유저층이 '권능'의 손맛을 나눠 가지는 것이 몰입의 핵심입니다. 여기에 스쿼드 모드가 주는 '멀티 클라이언트 없이 내 캐릭터 여럿을 한 번에 굴리는' 편의성의 쾌감이 더해집니다.","benchmarks":"① 최상위 유저에게 필드 규칙·BM 방향성 등 실질적 발언권을 주는 '신권' 같은 유저 거버넌스 설계는 과금 유인과 커뮤니티 권력 서사를 동시에 만족시키는 구조입니다. ② 스쿼드 모드로 멀티 클라이언트 없이 부캐 동시 육성을 지원해, 최근 유저들의 '부계정 동시 운용' 니즈를 정식 시스템으로 흡수하며 이탈을 방지했습니다. ③ 다이아·아이템 가치 보존을 공개 원칙으로 못박아 인플레이션 우려를 선제 차단하는 커뮤니케이션 전략을 취했습니다. ④ 출시 초반 화력을 오딘·리니지M 등 기존 강자와의 장기 매출 경쟁으로 이어가기 위해 월드 거래소 같은 신규 경제 시스템을 출시 이후에도 순차 투입하는 라이브 서비스 페이싱이 눈에 띕니다.","businessModel":"확률형 '갓아머'(변신)·'영체'(펫) 가챠가 핵심 매출원이지만, 무료 재화 '나인'으로도 일일 한도 내에서 접근할 수 있게 열어뒀습니다. 경험치 포션 같은 '드상'(성장 촉진) 요소는 실화폐 결제 대신 인게임 재화로만 얻도록 설계해 '드상 없는 MMORPG'라는 포지셔닝을 내세우며, 유료 재화로 얻은 아이템의 자유 거래를 지원해 유저 간 경제를 활성화하는 방향을 택했습니다.","onboarding":"초반부터 자동사냥·자동이동 등 편의 기능을 적극 지원해 전통 MMORPG 대비 진입장벽을 낮췄습니다. 신권·스쿼드 모드 같은 핵심 차별화 시스템은 레벨 40 이후 순차적으로 해금되도록 설계돼, 초반 정보량을 분산시키고 신규 유저가 기본 조작에 먼저 익숙해지도록 유도합니다.","targetUser":"혈맹 전쟁·필드 쟁탈전 같은 옛 리니지류 MMORPG 감성을 그리워하는 3040대 코어 유저를 1차 타겟으로 하면서도, 스쿼드 모드의 육성 편의성을 앞세워 반복 사냥의 피로도를 꺼리는 라이트 유저까지 폭넓게 흡수하는 포지셔닝을 취합니다.","community":"신권 획득을 둘러싼 서버 단위 경쟁이 길드 간 협력·견제, 정치적 동맹 구도를 만들어내며 활발한 화두가 되고 있고, 디시인사이드 마이너 갤러리 등에서는 매출 순위 변동, 신권 주인 교체, 확률형 BM에 대한 논쟁이 상시적으로 오가고 있습니다.","links":[{"title":"구글 매출 1위, 넷마블 '솔: 인챈트' 왜 이용자들은 열광했나","url":"https://www.gamevu.co.kr/news/articleView.html?idxno=59176","source":"게임뷰"},{"title":"'솔: 인챈트', 스쿼드 모드 직접 해보니...부캐 육성 속도 '신세계'","url":"https://www.khgames.co.kr/news/articleView.html?idxno=305945","source":"경향게임스"},{"title":"넷마블 '솔: 인챈트' 다이아 가치 보존 선언, 7월 월드 거래소 도입","url":"https://www.gamevu.co.kr/news/articleView.html?idxno=58959","source":"게임뷰"},{"title":"넷마블 '솔: 인챈트'와 카카오게임즈 '오딘' 모바일 매출 상위권 유지","url":"https://www.gamevu.co.kr/news/articleView.html?idxno=59393","source":"게임뷰"}]},{"date":"2026-07-21","game":"승리의 여신: 니케 (Goddess of Victory: NIKKE)","hook":"3주년을 넘긴 서비스 4년차 게임임에도 여름 시즌 업데이트(신규 니케 '신데렐라: 크리스탈 웨이브'·'마르차나: 마린 스터디') 이후 한국 앱스토어 매출 1위를 탈환하고 일본·대만에서도 2위에 오르며 역주행했고, 서울 YES24 라이브홀에서 이틀간 연 밴드 콘서트 'Full Burst Live'까지 성료시키며 온·오프라인 양쪽에서 동시에 화제를 모으고 있는 건슈팅 수집형 RPG입니다.","coreLoop":"스테이지 진입 → 엄폐 기반 3인칭 슈팅으로 적 처치 및 실드 파괴 → 니케별 고유 '버스트 스킬'을 I→II→III 순서로 연계 발동 → 5인 전원의 화력이 동시에 폭발하는 '풀 버스트' 10초 구간에서 결정타 → 스테이지 클리어로 재화·장비 획득 → 강화·조합 개편 후 다음 구간 도전, 이 순환이 반복됩니다. 전투 외에는 '지휘관의 방'(스킨 착용 니케와의 대화·터치 상호작용)이라는 비전투 소셜 루프가 별도로 병행됩니다.","growthCurve":"성장은 (1) 니케 개인 레벨·코어 강화 (2) 무기 등급업 (3) 팀 시너지(버스트 타입 조합) 숙련이라는 3중 축으로 짜여 있습니다. 초반에는 대충 화력 높은 니케만 넣어도 진행되지만, 후반 고난도 콘텐츠로 갈수록 '버스트I-버스트II-버스트III×2' 구성과 40초 쿨타임의 버스트III 유닛을 2인 운용해 20초마다 풀 버스트를 끊김 없이 연쇄시키는 정교한 로테이션 설계가 요구되어, 캐릭터 보유량보다 조합 최적화가 성장 체감의 핵심이 되는 후반 곡선을 보입니다.","funMechanics":"재미의 핵심은 평소엔 개별 캐릭터가 따로 쏘던 화력이 버스트 스킬 연계 성공 시 한 방향으로 폭발적으로 집중되는 '풀 버스트'의 카타르시스입니다. 오락실 건슈팅(하우스 오브 더 데드류)의 손맛에 수집형 RPG의 캐릭터 육성·꾸미기 요소를 결합해, 전투의 타격감과 캐릭터에 대한 애착이라는 서로 다른 쾌감이 동시에 작동합니다.","benchmarks":"① 개별 캐릭터 스킬을 '순서대로 눌러야 완성되는' 팀 단위 콤보로 설계해 단순 슈팅에 전략적 팀빌딩 깊이를 더한 구조. ② 게임 내 콘텐츠(여름 이벤트)와 오프라인 라이브 콘서트를 연동해 IP 몰입도를 게임 밖 실물 경험으로 확장한 라이브 운영. ③ 서비스 3년이 넘은 시점에도 시즌 테마(수영복 등)와 풀보이스 스토리, 신규 미니게임을 매 시즌 갱신해 '역주행'이 가능한 콘텐츠 페이싱 유지. ④ 코스튬 가챠 논란 발생 시 무료 티켓 배포로 천장가를 실질적으로 낮추는 등, 논란에 즉각적인 완화책을 내놓아 이탈을 최소화하는 대응 패턴.","businessModel":"부분유료화 가챠 모델로, 신규 니케(캐릭터) 뽑기와 별도의 코스튬(스킨) 뽑기가 이원화된 매출원입니다. 코스튬 가챠는 천장가가 대략 7만5천~9만원 선이며, 유니크 코스튬 2벌을 채우면 18만원 안팎까지 치솟아 업계 평균보다 높은 과금 강도로 종종 논란이 됩니다. 최근에는 '애장품' 시스템 같은 신규 과금 콘텐츠 도입 계획이 시기상조라는 여론에 부딪히는 등, 캐릭터 IP 파워로 매출을 유지하면서도 과금 설계를 둘러싼 긴장이 상존합니다.","onboarding":"튜토리얼은 기본 스쿼드로 스테이지를 클리어하며 버스트I→II→III 개념을 자연스럽게 체득하도록 구성돼 있어 슈팅 자체의 진입장벽은 낮습니다. 다만 버스트 타입별 역할, 원소 상성, 쿨타임 관리 등 '제대로 된 팀'을 짜려면 알아야 할 정보량이 상당해, 캐주얼하게 즐기는 단계와 고난도 콘텐츠 공략 단계 사이의 학습 곡선 격차가 뚜렷한 편입니다.","targetUser":"미소녀 캐릭터 수집·꾸미기에 호의적인 코어 서브컬처 게이머를 1차 타겟으로 하되, 슈팅 손맛과 팀빌딩 전략성을 앞세워 일반 수집형 RPG 유저까지 포괄합니다. 이번 여름 업데이트와 콘서트 흥행은 기존 팬덤의 충성도가 3년 넘게 유지되고 있음을 보여주는 동시에, IP 자체의 대중 문화 콘텐츠(음악·굿즈)로의 확장 가능성을 시사합니다.","community":"팀 조합·버스트 로테이션 최적화가 필수적인 구조라 스쿼드 공략 정보 공유가 활발하고, 신규 니케 출시 때마다 티어표·조합 논쟁이 커뮤니티(에펨코리아, 루리웹, 디스코드)의 주요 화두가 됩니다. 이번처럼 오프라인 밴드 라이브 콘서트를 정기적으로 열어 팬덤과 직접 소통하는 것도 특징으로, 게임 내 이벤트와 실물 팬 행사를 연동해 커뮤니티 결속력을 유지하는 전략을 취하고 있습니다.","links":[{"title":"'승리의 여신: 니케', 여름 업데이트 앱스토어 매출 역주행 1위!","url":"https://www.khgames.co.kr/news/articleView.html?idxno=306043","source":"경향게임스"},{"title":"시프트업 '니케', 일본 구글 매출 1위…여름 업데이트 효과","url":"https://zdnet.co.kr/view/?no=20260708150858","source":"ZDNet Korea"},{"title":"승리의 여신: 니케, 밴드 라이브 콘서트 'Full Burst Live' 성료","url":"https://www.inven.co.kr/webzine/news/?news=318664","source":"인벤"},{"title":"여름 흥행 질주 '니케', 팝업과 밴드 공연 핵심 굿즈는?","url":"https://www.gameple.co.kr/news/articleView.html?idxno=216016","source":"게임플"}]},{"date":"2026-07-20","game":"마비노기 모바일 (Mabinogi Mobile)","hook":"2025년 3월 PC 원작 '마비노기'의 세계관을 모바일로 재해석해 출시된 이후 꾸준한 신규 레이드·업데이트로 화제를 유지해 왔지만, 최근에는 콘텐츠보다 과금 논란(웨카 경매장 철회, 고가의 패션 뽑기·합성 시스템)으로 더 자주 이름이 오르내리는 게임입니다.","coreLoop":"필드 탐험·퀘스트 수행 → '우연한 만남' 크로스서버 매칭으로 다른 유저와 자동 파티 결성 → 사냥·던전 클리어로 성장 재화 획득 → 장비 강화·클래스 체인지로 전투력 상승 → 다음 구간 진행, 이 순환이 반복됩니다. 전투 외에도 낚시·요리·채집·제작 같은 비전투 생활 콘텐츠가 별도 루프로 병행되며, 성장과 무관하게 여유롭게 즐길 수 있는 서브 루프로 설계돼 있습니다.","growthCurve":"전투 클래스는 무기를 바꿔 들면 스킬셋이 자동 전환되는 '클래스 체인지 시스템'으로, 캐릭터 하나로 여러 역할을 오가며 성장 곡선을 완만하게 유지합니다. 장비 강화·각인 등 전투력 성장 축과는 별개로 생활 스킬 숙련도가 독립적으로 쌓이는 이중 곡선이 특징이며, 초반에는 메인 스토리를 따라가는 것만으로 자연스럽게 성장하지만 최상위 구간으로 갈수록 확률형 장비 뽑기·합성 의존도가 급격히 높아지는 점이 밸런스 논쟁의 원인이 되고 있습니다.","funMechanics":"PC 원작 특유의 '따뜻한 커뮤니티' 감성을 모바일에 그대로 옮긴 것이 핵심 재미입니다. '우연한 만남' 시스템은 파티 보너스를 주지 않는 대신 순수하게 우연한 사회적 교류를 유도하고, 경쟁보다 힐링·꾸미기·생활 콘텐츠에 무게를 둬 코어 MMO 유저가 아니어도 부담 없이 즐길 수 있는 저강도 재미를 제공합니다.","benchmarks":"① 하나의 캐릭터로 여러 클래스를 오가게 하는 '클래스 체인지'로 로스터 관리 피로도를 낮춘 설계. ② 전투와 무관한 생활 콘텐츠를 독립된 성장 축으로 분리해 비경쟁 유저층까지 넓힌 포지셔닝. ③ '웨카 경매장'을 출시 일주일 만에 전면 철회한 사례는, 사전 검증 없이 유료 재화 기반 거래 시스템을 내놓았을 때 등급분류·소비자 신뢰 리스크가 얼마나 빨리 터질 수 있는지 보여주는 반면교사입니다. ④ 수익 버그는 즉시 수정하고 유저 경험 버그는 방치하는 이중잣대 운영이 커뮤니티 신뢰를 얼마나 빠르게 갉아먹는지도 함께 참고할 지점입니다.","businessModel":"부분유료화 기반으로, 패션(외형) 아이템 뽑기와 에픽→전설 합성 시스템이 핵심 매출원입니다. 패션 뽑기는 부위별 천장이 약 20만 원으로 4부위를 채우면 사실상 80만 원 규모이며, 확률 20%의 합성 시스템까지 더해져 업계 평균 대비 과금 강도가 높다는 평가를 받습니다. 이 외 주간 구매 패키지에 성장 재화 상자를 포함시키는 등 스펙업 성격의 상품도 점차 늘고 있어, '힐링 게임' 포지셔닝과 과금 설계 사이의 괴리가 논란의 핵심입니다.","onboarding":"여섯 가지 견습 클래스 중 하나로 시작해 메인 스토리를 따라가면 자연스럽게 시스템을 익히도록 구성돼 있고, 크로스서버 매칭 덕분에 초반부터 다른 유저와 자연스럽게 어울리며 학습하게 됩니다. 다만 생활 콘텐츠·클래스 체인지·이중 뽑기 시스템 등 정보량이 많아, 온보딩 자체는 완만해도 '제대로 하려면' 알아야 할 시스템이 빠르게 늘어나는 편입니다.","targetUser":"PC 마비노기의 기존 팬덤과, 경쟁보다 힐링·꾸미기·소통을 원하는 라이트~미들 MMO 유저를 동시에 겨냥합니다. 실제로 10~20대 이용자 비중이 70%에 달한다는 조사 결과처럼 젊은 층, 특히 꾸미기·감성 콘텐츠에 반응하는 유저층에서 강세를 보이는 포지셔닝입니다.","community":"크로스서버 실시간 매칭('우연한 만남')과 생활 콘텐츠를 통한 자연스러운 교류가 커뮤니티 형성의 핵심 장치입니다. 다만 최근에는 아카라이브 등 커뮤니티에서 과금 논란과 버그 대응 이중잣대에 대한 비판 여론이 활발히 공유되며, 긍정적 교류 못지않게 운영 신뢰에 대한 집단적 문제 제기가 커뮤니티의 주요 화두가 되고 있습니다.","links":[{"title":"10-20대가 70%, MMO 장르 이끈 마비노기 모바일","url":"https://www.gamemeca.com/view.php?gid=1767354","source":"게임메카"},{"title":"[현장] '1100억 투입' 마비노기 모바일, 기본도 못 지킨 치명적 버그에 신뢰 와르르","url":"https://alphabiz.co.kr/news/view/1065607785515696","source":"알파경제"},{"title":"[게임 맥락읽기] '투명한 BM' 압박 가중… 넥슨 웨카 사태가 남긴 교훈","url":"https://www.pointdaily.co.kr/news/articleView.html?idxno=284526","source":"포인트데일리"},{"title":"마비노기 모바일/논란 및 사건 사고","url":"https://namu.wiki/w/%EB%A7%88%EB%B9%84%EB%85%B8%EA%B8%B0%20%EB%AA%A8%EB%B0%94%EC%9D%BC/%EB%85%BC%EB%9E%80%20%EB%B0%8F%20%EC%82%AC%EA%B1%B4%20%EC%82%AC%EA%B3%A0","source":"나무위키"}]},{"date":"2026-07-15","game":"멧챠 카멜레온 (MECCHA CHAMELEON)","hook":"일본 2인 개발팀이 두 달 만에 만든 6,500원짜리 숨바꼭질 게임이 광고비 한 푼 없이 입소문만으로 출시 한 달 만에 1,500만 장을 팔며 오버워치·에이펙스 레전드의 동시접속자까지 앞질러, 2026년 가장 화제가 되고 있는 인디 게임입니다.","coreLoop":"라운드 시작 → 하이더(숨는 자)는 흰 몸에 색을 칠해 주변 환경(벽·소품·바닥 텍스처)에 위장 → 시커(찾는 자)는 제한시간 안에 모든 하이더를 색출 → 라운드 종료 후 팀 교대, 이 순환이 반복됩니다. 색상 피커, 채도·명도 조절, 브러시 종류·크기, 스포이드까지 갖춘 정교한 페인팅 도구가 핵심 인터페이스이며, 완벽하게 위장했다가 숨소리나 사소한 움직임으로 발각되는 순간이 매 라운드 반복되는 텐션의 근원입니다.","growthCurve":"전통적인 레벨·장비 성장이 전혀 없습니다. 대신 (1) 맵 자체의 난이도(단순한 단색 배경 → 복잡한 패턴·소품이 뒤섞인 맵)로 자연스러운 페이싱을 만들고, (2) 플레이어의 위장·수색 '숙련도'(어디에 숨을지, 어떤 색·패턴 조합이 통하는지 감각적으로 학습하는 것)가 유일한 성장축이며, (3) 2~24인 인원 구성과 4개 게임모드 조합으로 매 세션마다 난이도가 재구성됩니다. 캐릭터가 아니라 '유저의 눈썰미'가 성장하는 구조입니다.","funMechanics":"재미의 핵심은 완벽한 위장 뒤 사소한 실수로 발각되는 반전 코미디와, 그 장면이 그대로 15초 안팎의 숏폼 클립으로 편집 가능한 '밈 생성 구조'입니다. 별다른 서사나 목표 없이 '몰래 숨기 vs 찾기'라는 원초적 놀이 본능만으로 승부하며, 위장에 성공했다는 안도감과 들켰을 때의 허탈한 웃음이 반복적으로 교차하는 감정 곡선이 몰입을 만듭니다.","benchmarks":"① 광고비 0원으로 대형 프랜차이즈의 동시접속자를 추월한 사례 — 게임 자체가 '숏폼에 최적화된 웃긴 장면'을 구조적으로 생산하도록 설계되어 마케팅을 대체했습니다. ② 친구 목록·랭크·길드 등 소셜 인프라를 의도적으로 배제해 '가벼운 파티 게임'이라는 포지셔닝을 지킨 미니멀 설계. ③ 스팀 창작마당을 조기 지원해 유저 제작 맵으로 콘텐츠 수명을 외주화한 라이브 운영. ④ 2인 개발·2개월 제작이라는 초저비용 구조가 6,500원 가격에도 압도적 수익률을 만들어낸 인디 개발 사례.","businessModel":"완전 프리미엄 단일 구매(5.99달러, 국내 약 6,500원) 모델로, DLC·시즌패스·인앱결제가 전무합니다. 마케팅 비용을 전혀 쓰지 않아 매출 대부분이 순이익으로 직결되는 초고효율 구조이며, 향후 창작마당 관련 유료화나 코스메틱 도입 가능성이 거론되지만 현재까지는 순수 판매 모델을 유지하고 있습니다.","onboarding":"규칙은 '숨어라' 또는 '찾아라' 한 문장으로 설명될 만큼 단순합니다. 색칠 도구도 직관적인 UI(색상 피커+스포이드)로 구성돼 별도 튜토리얼 없이 첫 판부터 바로 이해되며, 초반부터 웃긴 상황이 발생해 학습보다 '체험'으로 몰입시킵니다. 이 낮은 진입장벽이 숙련된 게이머는 물론 비게이머 시청자까지 자연스럽게 끌어들이는 핵심 요인입니다.","targetUser":"정교한 조작이나 학습이 필요 없어, 친구·크루와 함께 웃고 떠들기 위한 캐주얼·파티 플레이어와 숏폼 콘텐츠 소비자(틱톡·유튜브 쇼츠 시청층)를 동시에 겨냥합니다. 스트리머의 다인 합방을 통해 비게이머 시청자가 자연스럽게 구매·유입되는 '보는 재미 → 하는 재미' 전환 구조가 기존 파티 게임과의 차별화 포인트입니다.","community":"친구 목록·랭크 시스템을 배제한 대신 최대 24인 동시 플레이와 스팀 창작마당 커스텀 맵으로 자생적 콘텐츠 생태계를 유도합니다. 트위치·유튜브 스트리머들의 '합방'(다인 방송 콜라보)이 확산의 최대 동력이며, 그 방송을 본 시청자가 직접 게임을 구매해 다음 합방에 참여하는 선순환이 커뮤니티 성장의 핵심 고리입니다.","links":[{"title":"Two Developers, $15 Million in Days: How 'Meccha Chameleon' Became Steam's Breakout Hit","url":"https://finance.biggo.com/news/95ed8469-2860-4bfc-82db-792f7aa936a8","source":"BigGo Finance"},{"title":"6500원짜리 숨바꼭질에 빠진 지구촌…1인 개발 게임 '멧챠 카멜레온' 대박 신화","url":"https://www.newsis.com/view/NISX20260706_0003696890","source":"뉴시스"},{"title":"두 명이 일군 700만장 판매 기적...'멧챠 카멜레온'은 어떻게 세계를 홀렸나","url":"https://zdnet.co.kr/view/?no=20260625090756","source":"ZDNet Korea"},{"title":"재미 치트키 탄생, '멧챠 카멜레온' 합방 게임 돌풍","url":"https://www.gameple.co.kr/news/articleView.html?idxno=215903","source":"게임플"},{"title":"The viral hit of 2026 has sold 15 million copies in a month on Steam, costs $5, and was made by 2 people","url":"https://www.windowscentral.com/gaming/the-viral-hit-of-2026-has-sold-15-million-copies-in-a-month-on-steam-costs-usd5-and-was-made-by-2-people","source":"Windows Central"}]},{"date":"2026-07-14","game":"발더스 게이트 3 (Baldur's Gate 3)","hook":"출시 3년차에도 스팀 최고 동시접속자 11만 명을 새로 찍고 누적 판매 2,000만 장을 돌파하며, DLC나 후속작 없이도 여전히 화제성을 유지하고 있는 CRPG의 기준점입니다.","coreLoop":"탐험(맵의 모든 구역에서 대화·상호작용 오브젝트 발견) → 대화·전투 중 매 순간 주사위 판정에 따른 선택과 결과 분기 → 파티원 관계·세계 반응의 변화 → 다음 지역으로 이동, 이 순환이 반복됩니다. 전투는 턴제 D&D 규칙을 그대로 구현하되 환경 요소(높이차, 기름·불, 밀치기)를 적극 활용하는 전술 퍼즐에 가깝고, 하나의 문제(자물쇠, NPC 설득, 장애물)에 전투·설득·잠입·마법 등 여러 해법이 동시에 열려 있는 것이 루프의 핵심입니다.","growthCurve":"성장은 (1) 캐릭터 레벨(12레벨 상한, 클래스·서브클래스 특성 해금), (2) 장비·아이템 발견을 통한 빌드 다양화, (3) 파티원 개인 서사(승인도·관계) 진행이라는 3중 곡선으로 설계됐습니다. 1막은 저레벨 D&D 특유의 취약함(체력 낮음, 실패 확률 높음)을 그대로 노출해 긴장감을 주고, 2~3막으로 갈수록 스킬 조합이 폭발적으로 늘어나며 난이도보다 '가능성'이 성장의 쾌감을 만듭니다. 커스텀 난이도·전술가 모드 등으로 유저가 직접 곡선을 조절하게 열어둔 것도 특징입니다.","funMechanics":"재미의 핵심은 '내가 상상한 해결책이 실제로 게임 시스템 안에서 작동한다'는 시스템적 자유도입니다. 대화 중 아무 때나 주사위를 굴려 결과가 갈리는 텐션, 우호도가 아니라 '개연성'으로 파티원이 반응하는 서사, 협동 전투에서 파티원 배치·환경 활용이 곧 전략이 되는 구조가 결합되어 매 판이 다른 이야기를 만들어냅니다.","benchmarks":"① 하나의 문제에 여러 정답을 동시에 허용하는 '시스템 기반 서사' 설계. ② 액트 단위로 완전히 새로운 지역·톤을 제공해 긴 개발·플레이 기간에도 지치지 않게 만든 콘텐츠 페이싱. ③ 3년의 얼리액세스 동안 커뮤니티 피드백을 정식 패치로 반영하며 신뢰를 쌓은 라이브 운영. ④ 상업적으로 성공한 뒤에도 '무리한 확장보다 완결'을 택한 브랜드 관리(DLC·후속작 대신 신규 IP로 전환).","businessModel":"완전 프리미엄 단일 구매 모델로, 출시 이후 부분유료화·시즌패스·마이크로트랜잭션을 전혀 도입하지 않았습니다. 수익은 ① 본편 패키지 판매(디럭스 에디션 포함) ② 플랫폼별 이식(PS5·Xbox·Mac) 신규 판매 ③ 스팀·GOG 등 지속 판매에서 발생하며, DLC나 후속작으로 수명을 늘리는 대신 완결 후 신규 IP 개발로 넘어가는 '한 작품 완주형' 수익 전략을 택했습니다.","onboarding":"러닝커브는 의도적으로 가파릅니다. D&D 5판 규칙을 그대로 노출하기 때문에 초반 진입장벽이 높지만, '커스텀 난이도'로 전투 난도를 낮추고 튜토리얼을 인트로 전투 시퀀스에 자연스럽게 녹여 규칙보다 상황으로 학습하게 유도합니다. 다만 클래스·주문 목록의 절대량이 많아, 숙련된 TRPG 유저와 완전 초심자 간 학습 속도 차이가 뚜렷합니다.","targetUser":"전통 CRPG·TRPG 팬을 코어 타겟으로 하되, 하이 퀄리티 시네마틱과 로맨스 서사로 콘솔·캐주얼 RPG 유저층까지 넓게 흡수했습니다. '규칙은 복잡해도 이야기는 누구나 즐길 수 있다'는 포지셔닝으로 D&D를 모르는 유저까지 시장을 확장한 것이 시리즈 역사상 최대 흥행의 배경입니다.","community":"최대 4인 협동 플레이와 파티원마다 다른 서사 분기가 맞물려, 플레이어들이 서로 다른 선택·결말을 비교·공유하는 문화가 커뮤니티(레딧, 유튜브)에서 자연스럽게 형성됩니다. 라리안은 출시 후에도 대규모 무료 패치(에필로그 추가 등)를 지속 제공하며 팬덤과의 소통을 이어갔고, 이는 DLC 없이도 화제성을 유지하는 핵심 동력이 됐습니다.","links":[{"title":"Baldur's Gate 3 Has Sold Over 20 Million Units","url":"https://www.vgchartz.com/article/466573/baldurs-gate-3-has-sold-over-20-million-units/","source":"VGChartz"},{"title":"Baldur's Gate 3 - Steam Charts","url":"https://steamcharts.com/app/1086940","source":"SteamCharts"},{"title":"발더스 게이트 3 \"DLC나 후속작 개발 안 한다\"","url":"https://www.gamemeca.com/view.php?gid=1746982","source":"게임메카"}]},{"date":"2026-07-13","game":"팰월드 (Palworld)","hook":"2년의 얼리액세스를 마치고 7월 10일 1.0 정식 출시, 스팀 동시접속자 85만 명을 돌파하며 국내외에서 가장 뜨거운 화제를 모으고 있는 생존·수집 하이브리드작입니다.","coreLoop":"탐험 → 팰 포획(팰 스피어 투척) → 베이스에 팰 배치·자동 노동 → 장비·시설 제작 → 보스·타워 레이드 도전 → 강화된 장비로 더 넓은 지역 탐험, 이 순환이 반복됩니다. 포켓몬처럼 생물을 수집하지만 전투는 총기·근접무기를 직접 조작하는 액션 슈터 방식이라, '수집 → 전투'와 '수집 → 노동력 투입'이라는 두 갈래 루프가 동시에 굴러가는 게 특징입니다.","growthCurve":"성장 축이 3중으로 설계되어 있습니다: (1) 플레이어 레벨(체력·스태미나·장비 슬롯), (2) 팰 레벨·개체값(전투·노동 효율), (3) 기술 트리(테크 포인트로 해금하는 무기·시설). 초반에는 소수의 만능형 팰로 채집을 자동화하는 데 집중하게 하고, 중반부터는 속성 상성(전기·화염·수속 등)에 맞춰 팰을 특화 배치해야 노동 효율이 급격히 오르도록 곡선을 짜서 '아무 팰이나 잡아도 되는 시기'와 '조합을 고민해야 하는 시기'를 명확히 나눕니다. 보스·타워 레이드는 난이도가 계단식으로 뛰어, 파밍 구간과 도전 구간을 번갈아 배치해 페이스를 조절합니다.","funMechanics":"가장 큰 재미의 원천은 '귀여운 크리처가 총을 들고, 컨베이어벨트에서 노동한다'는 부조화의 웃음 포인트입니다. 여기에 팩토리 자동화 게임 특유의 '시스템이 스스로 굴러가는 쾌감'과 크리처 수집·육성의 '내 팰을 키운다'는 애착이 결합됩니다. 총기 기반 액션 전투가 기존 크리처 수집 장르에 없던 속도감을 더하고, 협동 멀티플레이에서는 역할 분담(베이스 관리 vs 탐험)이 자연스럽게 생겨 사회적 재미까지 확장됩니다.","benchmarks":"① 서로 다른 장르(수집·생존·팩토리·슈터)를 하나의 루프 안에 자연스럽게 녹여낸 설계. ② '포켓몬 표절' 논란을 정면 대응하지 않고 화제성으로 흡수한 커뮤니케이션 전략. ③ 2년간 얼리액세스 동안 커뮤니티 피드백을 빠르게 반영하며 신뢰를 쌓은 라이브 서비스 운영. ④ 엑스박스 게임패스 데이원 입점으로 초기 유저 볼륨을 확보하고, 정식 출시 시점에 가격을 올리지 않아(29.99달러 유지) '보답'이라는 메시지로 커뮤니티 호감을 재확인한 점도 눈여겨볼 만합니다.","businessModel":"완전 프리미엄(원타임 구매, 부분유료 가챠·광고 없음) 모델을 유지하며 가격은 1.0 출시 이후에도 29.99달러로 동결했습니다. 수익원은 ① 본편 패키지 판매 ② 엑스박스 게임패스 입점을 통한 구독 매출 배분 ③ 향후 코스메틱 등 유료 DLC ④ IP 확장(실물 카드게임, 스핀오프작 발표)입니다. 광고성 부분유료화 대신 '가격 동결'과 'IP 확장'으로 장기 수익을 도모하는 방향이 특징입니다.","onboarding":"튜토리얼은 최소한으로 유지하고, 첫 팰 포획과 베이스 건설을 15분 내 자연스럽게 경험하게 유도합니다. 무기 제작과 자동화 시스템은 진행하며 하나씩 해금되는 방식이라 초반 정보 과부하가 적고, '일단 해보면 이해되는' 직관적 UI가 학습 곡선을 완만하게 만듭니다. 다만 후반 조합형 팰 배치나 레이드 준비는 위키·커뮤니티 공략 의존도가 높아, 자체 학습만으로는 벽을 느끼는 유저도 존재합니다.","targetUser":"'포켓몬을 좋아했지만 더 성인 취향의 자유도를 원하는' 20~30대 코어 게이머를 1차 타겟으로 하면서도, 팩토리·자동화 게임 팬(팩토리오 등)과 생존 크래프팅 팬(아크, 발헤임)까지 포괄하는 크로스오버 포지셔닝을 취합니다. 크리처 수집이라는 친숙한 프레임으로 진입 장벽을 낮추면서도, 총기·생존 요소로 '더 자유롭고 폭력적인 대안'이라는 차별화된 자리를 확보했습니다.","community":"전용 서버 호스팅과 다인 협동 플레이를 지원해 친구·길드 단위의 자생적 커뮤니티가 형성되기 쉽습니다. 팰 도감 완성이나 희귀 팰 교환 같은 수집 요소가 디스코드·레딧 등 외부 커뮤니티에서 자발적 정보 공유를 유도하고, 개발사가 로드맵·패치노트를 커뮤니티에 직접 공개하며 소통하는 방식이 팬덤의 신뢰와 화제 유지에 기여하고 있습니다.","links":[{"title":"'팰월드' 정식 출시 스팀 동접 85만 '괴력', 크래프톤 모바일 버전 기대감 상승","url":"https://www.khgames.co.kr/news/articleView.html?idxno=306296","source":"경향게임스"},{"title":"'팰월드', 2년간 얼리 액세스 마치고 1.0 정식 출시","url":"https://www.khgames.co.kr/news/articleView.html?idxno=306273","source":"경향게임스"},{"title":"Palworld Won't Raise Its Price Following 1.0 Launch","url":"https://www.gamespot.com/articles/palworld-wont-raise-its-price-following-1-0-launch/","source":"GameSpot"},{"title":"Palworld 1.0 Launches July 10: Wing Pack, World Tree, Free for Existing Players","url":"https://www.techtimes.com/articles/319440/20260701/palworld-10-launches-july-10-wing-pack-world-tree-free-existing-players.htm","source":"Tech Times"}]}]</script>

      <button class="cal-nav-btn" type="button" id="cal-prev" aria-label="이전 달">‹</button>
      <h2 class="cal-title mono" id="cal-title">–</h2>
      <button class="cal-nav-btn" type="button" id="cal-next" aria-label="다음 달">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend">
      <span><span class="cal-legend-dot" style="background:var(--accent)"></span>정식 출시</span>
      <span><span class="cal-legend-dot" style="background:var(--wire-industry)"></span>업데이트 · 오픈</span>
      <span><span class="cal-legend-dot" style="background:var(--beta)"></span>CBT · OBT · 베타</span>
    </div>
  </section>

  <section id="view-analysis" class="view" hidden>
    <div class="news-toolbar">
      <select id="analysis-select" class="day-select mono" aria-label="분석 게임 선택"></select>
    </div>
    <div id="analysis-content"></div>
    <div class="empty-state" id="analysis-empty" hidden>아직 등록된 심층 분석이 없습니다.</div>
  </section>
</main>

<footer>매일 오전 자동 수집 · 게임 업계 동향과 신작 소식</footer>

<script>
  (function () {
    var entries = [];
    try { entries = JSON.parse(document.getElementById('dispatch-data').textContent) || []; } catch (e) { entries = []; }
    entries.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var releases = [];
    try { releases = JSON.parse(document.getElementById('release-data').textContent) || []; } catch (e) { releases = []; }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s == null ? '' : s;
      return d.innerHTML;
    }

    function fmtDate(iso) {
      var parts = iso.split('-');
      if (parts.length !== 3) return iso;
      return parts[0] + '.' + parts[1] + '.' + parts[2];
    }

    /* ---- tabs ---- */
    var tabBtns = document.querySelectorAll('.tab-btn');
    var views = { news: document.getElementById('view-news'), calendar: document.getElementById('view-calendar'), analysis: document.getElementById('view-analysis') };
    tabBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabBtns.forEach(function (b) {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });
        Object.keys(views).forEach(function (key) { views[key].hidden = key !== btn.dataset.tab; });
      });
    });

    /* ---- news view ---- */
    var timeline = document.getElementById('timeline');
    var emptyState = document.getElementById('empty-state');
    var statCount = document.getElementById('stat-count');
    var daySelect = document.getElementById('day-select');

    function renderStory(story) {
      var title = story.url
        ? '<a href="' + esc(story.url) + '" target="_blank" rel="noopener">' + esc(story.title) + '</a>'
        : esc(story.title);
      var meta = [];
      if (story.source) meta.push(esc(story.source));
      if (story.articleDate) meta.push(fmtDate(story.articleDate) + ' 작성');
      var source = meta.length ? '<div class="story-source mono">' + meta.join(' · ') + '</div>' : '';
      return (
        '<div class="story">' +
          '<h3 class="story-title">' + title + '</h3>' +
          '<p class="story-blurb">' + esc(story.blurb) + '</p>' +
          source +
        '</div>'
      );
    }

    function renderGroup(label, className, stories) {
      if (!stories || !stories.length) return '';
      var items = stories.map(renderStory).join('');
      return (
        '<div class="wire-group">' +
          '<span class="wire-label ' + className + '">' + esc(label) + '</span>' +
          '<div class="story-list">' + items + '</div>' +
        '</div>'
      );
    }

    function renderDay(entry) {
      var groups = renderGroup('업계 동향', 'industry', entry.industry) +
                   renderGroup('신작 소식', 'release', entry.games);
      return (
        '<section class="day">' +
          '<h2 class="day-date mono">' + fmtDate(entry.date) + '</h2>' +
          (entry.lede ? '<p class="day-lede">' + esc(entry.lede) + '</p>' : '') +
          '<div class="day-groups">' + groups + '</div>' +
        '</section>'
      );
    }

    function renderSelection() {
      var val = daySelect.value;
      var shown = val === 'all' ? entries : entries.filter(function (e) { return e.date === val; });
      timeline.innerHTML = shown.map(renderDay).join('');
    }

    if (!entries.length) {
      emptyState.hidden = false;
      statCount.textContent = '0';
      daySelect.hidden = true;
    } else {
      emptyState.hidden = true;
      statCount.textContent = String(entries.length);
      var newest = entries[0].date;
      document.title = '게임 업계 뉴스 브리핑 · ' + fmtDate(newest);

      var options = '<option value="all">전체 보기</option>' + entries.map(function (entry, i) {
        return '<option value="' + esc(entry.date) + '">' + fmtDate(entry.date) + (i === 0 ? ' (최신)' : '') + '</option>';
      }).join('');
      daySelect.innerHTML = options;
      daySelect.value = newest;
      daySelect.addEventListener('change', renderSelection);

      renderSelection();
    }

    /* ---- calendar view ---- */
    var calGrid = document.getElementById('cal-grid');
    var calTitle = document.getElementById('cal-title');
    var calPrev = document.getElementById('cal-prev');
    var calNext = document.getElementById('cal-next');

    var releasesByDate = {};
    releases.forEach(function (r) {
      if (!r || !r.date) return;
      (releasesByDate[r.date] = releasesByDate[r.date] || []).push(r);
    });

    function typeClass(type) {
      if (['CBT', 'OBT', '베타', '얼리엑세스'].indexOf(type) !== -1) return 'type-beta';
      if (['업데이트', '오픈'].indexOf(type) !== -1) return 'type-update';
      return '';
    }

    var today = new Date();
    var viewYear = today.getFullYear();
    var viewMonth = today.getMonth();

    var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    function renderCalendar() {
      calTitle.textContent = viewYear + '.' + pad2(viewMonth + 1);

      var firstOfMonth = new Date(viewYear, viewMonth, 1);
      var startOffset = firstOfMonth.getDay();
      var gridStart = new Date(viewYear, viewMonth, 1 - startOffset);

      var todayKey = today.getFullYear() + '-' + pad2(today.getMonth() + 1) + '-' + pad2(today.getDate());

      var cells = WEEKDAYS.map(function (w) { return '<div class="cal-weekday">' + w + '</div>'; });

      for (var i = 0; i < 42; i++) {
        var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
        var key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        var isOut = d.getMonth() !== viewMonth;
        var isToday = key === todayKey;
        var dayReleases = releasesByDate[key] || [];

        var events = dayReleases.map(function (r) {
          var cls = typeClass(r.type);
          var label = esc(r.title);
          return r.url
            ? '<a class="cal-event ' + cls + '" href="' + esc(r.url) + '" target="_blank" rel="noopener" title="' + esc(r.title + (r.type ? ' · ' + r.type : '')) + '">' + label + '</a>'
            : '<span class="cal-event ' + cls + '" title="' + esc(r.title) + '">' + label + '</span>';
        }).join('');

        cells.push(
          '<div class="cal-cell' + (isOut ? ' out' : '') + (isToday ? ' today' : '') + '">' +
            '<span class="cal-daynum mono">' + d.getDate() + '</span>' +
            events +
          '</div>'
        );
      }

      calGrid.innerHTML = cells.join('');
    }

    calPrev.addEventListener('click', function () {
      viewMonth -= 1;
      if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
      renderCalendar();
    });
    calNext.addEventListener('click', function () {
      viewMonth += 1;
      if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
      renderCalendar();
    });

    renderCalendar();

    /* ---- analysis view ---- */
    var analyses = [];
    try { analyses = JSON.parse(document.getElementById('analysis-data').textContent) || []; } catch (e) { analyses = []; }
    analyses.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var analysisSelect = document.getElementById('analysis-select');
    var analysisContent = document.getElementById('analysis-content');
    var analysisEmpty = document.getElementById('analysis-empty');

    var ANALYSIS_SECTIONS = [
      { key: 'coreLoop', label: '코어 루프' },
      { key: 'growthCurve', label: '성장 · 밸런싱 곡선' },
      { key: 'funMechanics', label: '재미를 만드는 핵심 장치' },
      { key: 'benchmarks', label: '기획자로서 벤치마킹할 점' },
      { key: 'businessModel', label: '수익 구조' },
      { key: 'onboarding', label: '온보딩 · 학습 곡선' },
      { key: 'targetUser', label: '타겟 유저 · 포지셔닝' },
      { key: 'community', label: '소셜 · 커뮤니티 장치' }
    ];

    function renderAnalysis(item) {
      var sections = ANALYSIS_SECTIONS.map(function (s, i) {
        if (!item[s.key]) return '';
        return (
          '<div class="analysis-section">' +
            '<h3 class="analysis-section-title"><span class="analysis-section-num">' + (i + 1) + '</span>' + esc(s.label) + '</h3>' +
            '<p class="analysis-section-body">' + esc(item[s.key]) + '</p>' +
          '</div>'
        );
      }).join('');

      var links = (item.links || []).map(function (l) {
        var title = l.url
          ? '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.title) + '</a>'
          : esc(l.title);
        var source = l.source ? '<span class="analysis-link-source mono">' + esc(l.source) + '</span>' : '';
        return '<div class="analysis-link">' + title + source + '</div>';
      }).join('');

      analysisContent.innerHTML =
        '<h2 class="analysis-game">' + esc(item.game) + '</h2>' +
        (item.hook ? '<p class="analysis-hook">' + esc(item.hook) + '</p>' : '') +
        '<div class="analysis-sections">' + sections + '</div>' +
        (links ? '<div class="analysis-links"><div class="analysis-links-title">관련 뉴스 · 자료</div><div class="analysis-link-list">' + links + '</div></div>' : '');
    }

    function renderAnalysisSelection() {
      var val = analysisSelect.value;
      var item = analyses.filter(function (a) { return (a.game + '|' + a.date) === val; })[0];
      if (item) renderAnalysis(item);
    }

    if (!analyses.length) {
      analysisEmpty.hidden = false;
      analysisSelect.hidden = true;
    } else {
      analysisEmpty.hidden = true;
      var analysisOptions = analyses.map(function (a, i) {
        var key = a.game + '|' + a.date;
        return '<option value="' + esc(key) + '">' + esc(a.game) + ' (' + fmtDate(a.date) + ')' + (i === 0 ? ' · 최신' : '') + '</option>';
      }).join('');
      analysisSelect.innerHTML = analysisOptions;
      analysisSelect.addEventListener('change', renderAnalysisSelection);
      renderAnalysisSelection();
    }
  })();
</script>
