name: Daily game news briefing

on:
  schedule:
    # 10:00 Asia/Seoul, Monday through Friday (01:00 UTC)
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-game-news
  cancel-in-progress: false

jobs:
  generate:
    name: Research and generate briefing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate daily briefing
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/daily-game-news.md
          model: gpt-5.6-terra
          effort: medium
          # The briefing requires checking current public news sources.
          sandbox: danger-full-access
          safety-strategy: drop-sudo

      - name: Validate generated data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          for (const key of ['entries', 'releases', 'analyses']) {
            if (!Array.isArray(data[key])) throw new Error(`data.json: ${key} must be an array`);
          }

          const html = fs.readFileSync('index.html', 'utf8');
          for (const id of ['dispatch-data', 'release-data', 'analysis-data']) {
            const match = html.match(new RegExp(`<script id="${id}" type="application/json">\\s*([\\s\\S]*?)\\s*<\\/script>`));
            if (!match) throw new Error(`index.html: missing ${id}`);
            JSON.parse(match[1]);
          }
          NODE

      - name: Upload publishable files
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing
          path: |
            data.json
            index.html
          if-no-files-found: error

  publish:
    name: Commit and publish briefing
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: daily-briefing
          path: .

      - name: Commit and push when content changed
        shell: bash
        run: |
          git add -- data.json index.html
          if git diff --cached --quiet; then
            echo "No briefing changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily briefing: $(TZ=Asia/Seoul date +%F)"
          git push origin HEAD:master
